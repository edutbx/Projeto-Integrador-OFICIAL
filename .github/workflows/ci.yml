name: CI - Monorepo Quality Gate

on:
  workflow_dispatch:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect-changes:
    name: Detect Changed Stacks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      java: ${{ steps.filter.outputs.java }}
      frontend: ${{ steps.filter.outputs.frontend }}
      docker: ${{ steps.filter.outputs.docker }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Filter paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            java:
              - 'backend/**'
              - '.github/workflows/ci.yml'
            frontend:
              - 'frontend/**'
              - '.github/workflows/ci.yml'
            docker:
              - 'docker-compose.yml'
              - 'backend/Dockerfile'
              - 'frontend/Dockerfile'
              - 'frontend/nginx.conf'
              - '.github/workflows/ci.yml'

  java-backend:
    name: Java Backend (JDK ${{ matrix.java-version }})
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.java == 'true'

    strategy:
      fail-fast: false
      matrix:
        java-version: ['17', '21']

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - run: chmod +x mvnw

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java-version }}
          cache: maven

      - run: ./mvnw -v

      - name: Build + Tests + Coverage
        run: |
          ./mvnw -B -ntp clean verify \
            -Djava.version=${{ matrix.java-version }}

      - name: Static Analysis
        run: |
          ./mvnw -B -ntp \
            -Djava.version=${{ matrix.java-version }} \
            checkstyle:check \
            pmd:check \
            com.github.spotbugs:spotbugs-maven-plugin:4.8.6.6:check

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: java-${{ matrix.java-version }}
          path: |
            backend/target/surefire-reports/**
            backend/target/failsafe-reports/**
            backend/target/site/jacoco/**
          if-no-files-found: ignore

  frontend:
    name: Frontend (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend == 'true'

    strategy:
      fail-fast: false
      matrix:
        node-version: ['20', '22']

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci --no-audit

      - name: Security audit (critical only)
        run: |
          npm audit --omit=dev --json > audit.json || true
          node -e "
          const r=require('./audit.json');
          const c=r.metadata?.vulnerabilities?.critical||0;
          console.log('Critical:',c);
          if(c>0){console.error('Critical vulns');process.exit(1);}
          "

      - name: Type check
        run: |
          [ -f tsconfig.json ] && npm run typecheck --if-present || echo "No TS"

      - name: Lint
        run: |
          [ -f eslint.config.js ] || [ -f .eslintrc.json ] || [ -f .eslintrc.js ] \
          && npm run lint --if-present || echo "No ESLint"

      - name: Tests
        env:
          CI: true
        run: npm run test:ci

      - name: Build
        run: npm run build

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-${{ matrix.node-version }}
          path: |
            frontend/coverage/**
            frontend/dist/**
          if-no-files-found: ignore

  docker:
    name: Docker Validation
    runs-on: ubuntu-latest
    needs: [detect-changes, java-backend, frontend]
    if: needs.detect-changes.outputs.docker == 'true'

    steps:
      - uses: actions/checkout@v4

      - name: Validate docker-compose
        run: docker compose config

      - name: Build backend
        run: docker build -t backend-app backend

      - name: Build frontend
        run: docker build -t frontend-app frontend

      - name: Start containers
        run: docker compose up -d

      - name: Wait and check
        run: |
          sleep 10
          docker ps
          docker compose ps

      - name: Fail if container crashed
        run: |
          if docker ps -a | grep -q "Exited"; then
            echo "Container failed"
            docker logs $(docker ps -aq)
            exit 1
          fi

      - name: Stop containers
        run: docker compose down