name: CI - Monorepo Quality Gate

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

# Keep workflow-wide permissions empty; grant per-job access only.
permissions: {}

env:
  SONAR_HOST_URL: https://sonarcloud.io

# Cancel older runs for the same branch/PR to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect-changes:
    name: Detect Changed Stacks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      java: ${{ steps.filter.outputs.java }}
      python: ${{ steps.filter.outputs.python }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - name: Checkout (full history for accurate change detection)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Filter paths by stack
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            java:
              - 'backend/pom.xml'
              - 'backend/mvnw'
              - 'backend/mvnw.cmd'
              - 'backend/src/main/java/**'
              - 'backend/src/main/resources/**'
              - 'backend/src/test/java/**'
              - '.github/workflows/ci.yml'
            python:
              - 'backend/src/main/resources/ia-integration/**'
              - '.github/workflows/ci.yml'
            frontend:
              - 'frontend/**'
              - '.github/workflows/ci.yml'

  java-backend:
    name: Java Backend (JDK ${{ matrix.java-version }})
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.java == 'true'
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        java-version: ['17', '21']

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout (full history required by Sonar)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure Maven wrapper is executable
        run: chmod +x mvnw

      - name: Setup Temurin JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java-version }}
          cache: maven

      - name: Verify Maven wrapper
        run: ./mvnw -v

      - name: Build + unit/integration tests + JaCoCo coverage
        run: |
          ./mvnw -B -ntp clean verify \
            -Djava.version=${{ matrix.java-version }} \
            org.jacoco:jacoco-maven-plugin:prepare-agent \
            org.jacoco:jacoco-maven-plugin:report

      - name: Static analysis (Checkstyle, PMD, SpotBugs)
        run: |
          ./mvnw -B -ntp \
            -Djava.version=${{ matrix.java-version }} \
            checkstyle:check \
            pmd:check \
            com.github.spotbugs:spotbugs-maven-plugin:4.8.6.6:check

      - name: Upload Java test and coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: java-reports-jdk-${{ matrix.java-version }}
          path: |
            backend/target/surefire-reports/**
            backend/target/failsafe-reports/**
            backend/target/site/jacoco/**
          if-no-files-found: ignore

      - name: SonarCloud Scan (Java, single matrix leg)
        if: matrix.java-version == '21'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_ORG: ${{ secrets.SONAR_ORG }}
          MAVEN_SKIP_TESTS: 'true'
        run: |
          ./mvnw -B -ntp org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
            -Djava.version=21 \
            -DskipTests=${MAVEN_SKIP_TESTS} \
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY_BACKEND_JAVA }} \
            -Dsonar.organization=${SONAR_ORG} \
            -Dsonar.token=${SONAR_TOKEN} \
            -Dsonar.host.url=${SONAR_HOST_URL} \
            -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml

  python-backend:
    name: Python Backend (Py ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.python == 'true'
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    defaults:
      run:
        working-directory: backend/src/main/resources/ia-integration

    steps:
      - name: Checkout (full history required by Sonar)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: >-
            ${{ runner.os }}-pip-${{ matrix.python-version }}-
            ${{ hashFiles('backend/src/main/resources/ia-integration/requirements*.txt', 'backend/src/main/resources/ia-integration/pyproject.toml', 'backend/src/main/resources/ia-integration/poetry.lock') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ matrix.python-version }}-

      - name: Install runtime + quality dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Format check (black)
        run: black --check .

      - name: Type check (mypy)
        run: mypy saude_mais.py --ignore-missing-imports

      - name: Security SAST (bandit)
        run: bandit -r .

      - name: Dependency audit (pip-audit)
        continue-on-error: true
        run: pip-audit --progress-spinner off

      - name: Tests + coverage (pytest)
        run: |
          pytest -q \
            --maxfail=1 \
            --disable-warnings \
            --junitxml=pytest.xml \
            --cov=. \
            --cov-report=xml \
            --cov-report=term-missing

      - name: Upload Python test and coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-reports-py-${{ matrix.python-version }}
          path: |
            backend/src/main/resources/ia-integration/pytest.xml
            backend/src/main/resources/ia-integration/coverage.xml
          if-no-files-found: ignore

      - name: SonarCloud Scan (Python, single matrix leg)
        if: matrix.python-version == '3.11'
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_ORG: ${{ secrets.SONAR_ORG }}
        with:
          projectBaseDir: backend/src/main/resources/ia-integration
          args: >
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY_BACKEND_PYTHON }}
            -Dsonar.organization=${{ env.SONAR_ORG }}
            -Dsonar.token=${{ env.SONAR_TOKEN }}
            -Dsonar.python.coverage.reportPaths=coverage.xml

  frontend:
    name: Frontend (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend == 'true'
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        node-version: ['20', '22']

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout (full history required by Sonar)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit

      - name: Dependency audit (production vulnerabilities)
        shell: bash
        run: |
          npm audit --omit=dev --json > npm-audit.json || true
          node <<'NODE'
          const fs = require('fs');

          if (!fs.existsSync('npm-audit.json')) {
            console.error('npm audit did not produce a report.');
            process.exit(1);
          }

          const report = JSON.parse(fs.readFileSync('npm-audit.json', 'utf8'));
          const vulnerabilities = report.metadata?.vulnerabilities ?? {};
          const critical = vulnerabilities.critical ?? 0;
          const high = vulnerabilities.high ?? 0;
          const moderate = vulnerabilities.moderate ?? 0;
          const low = vulnerabilities.low ?? 0;

          console.log(`npm audit summary: critical=${critical}, high=${high}, moderate=${moderate}, low=${low}`);

          if (critical > 0) {
            console.error('Critical production vulnerabilities detected. Resolve them before merging.');
            process.exit(1);
          }
          NODE

      - name: Type check (TypeScript)
        shell: bash
        run: |
          if [ -f tsconfig.json ]; then
            npm run typecheck --if-present
          else
            echo 'Skipping TypeScript check: tsconfig.json not found.'
          fi

      - name: Lint (ESLint)
        shell: bash
        run: |
          if [ -f eslint.config.js ] || [ -f .eslintrc.js ] || [ -f .eslintrc.cjs ] || [ -f .eslintrc.json ]; then
            npm run lint --if-present
          else
            echo 'Skipping ESLint: no ESLint config file found.'
          fi

      - name: Unit tests (Vitest)
        env:
          CI: true
        run: npm run test:ci

      - name: Production build
        run: npm run build

      - name: Upload frontend coverage and build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-reports-node-${{ matrix.node-version }}
          path: |
            frontend/coverage/**
            frontend/dist/**
          if-no-files-found: ignore

      - name: SonarCloud Scan (Frontend, single matrix leg)
        if: matrix.node-version == '20'
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_ORG: ${{ secrets.SONAR_ORG }}
        with:
          projectBaseDir: frontend
          args: >
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY_FRONTEND }}
            -Dsonar.organization=${{ env.SONAR_ORG }}
            -Dsonar.token=${{ env.SONAR_TOKEN }}
            -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info
